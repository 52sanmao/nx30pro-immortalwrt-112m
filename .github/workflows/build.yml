name: build-immortalwrt-112m

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "ImmortalWrt 源码标签"
        required: true
        default: "v25.12.2"
      extra_packages:
        description: "额外软件包（空格分隔，可留空）"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf --one-file-system \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /opt/az \
            /usr/share/swift \
            /usr/local/lib/node_modules
          sudo apt-get clean
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            rsync unzip zlib1g-dev file wget quilt python3-setuptools \
            swig time libelf-dev cpio bc
          df -h /

      - name: 拉取 ImmortalWrt 源码
        run: |
          git clone --depth 1 --branch "${{ inputs.tag }}" \
            https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          git log -1 --format='commit %H%nsubject %s'

      - name: 改成 112M 大分区
        run: python3 scripts/enable_112m.py openwrt

      - name: 保存改动 diff
        run: |
          cd openwrt
          git --no-pager diff --stat
          git diff > "$GITHUB_WORKSPACE/112m-changes.diff"

      - name: 生成配置
        run: |
          cd openwrt
          cat > .config <<'EOC'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_h3c_magic-nx30-pro=y
          CONFIG_TARGET_MULTI_PROFILE=n
          CONFIG_PACKAGE_luci=y
          EOC
          if [ -n "${{ inputs.extra_packages }}" ]; then
            for p in ${{ inputs.extra_packages }}; do
              echo "CONFIG_PACKAGE_${p}=y" >> .config
            done
          fi
          make defconfig
          echo "=== nx30 相关配置 ==="
          grep -i "nx30" .config || echo "(无)"
          echo "=== 已选设备 ==="
          grep -c "^CONFIG_TARGET_DEVICE_" .config
          echo "=== 关键配置 ==="
          grep -E "CONFIG_TARGET_MULTI_PROFILE|CONFIG_TARGET_ROOTFS_SQUASHFS" .config || true
          grep -q "DEVICE_h3c_magic-nx30-pro=y" .config || { echo "ERROR: 设备未被选中，符号名可能不对"; exit 1; }

      - name: 预下载源码包
        run: |
          cd openwrt
          make -j"$(nproc)" download || echo "部分包下载失败，交给编译阶段重试"

      - name: 编译
        run: |
          cd openwrt
          make -j"$(nproc)"
          echo "=== 编译完成 ==="

      - name: 查看产物
        if: always()
        run: |
          echo "=== 磁盘 ==="
          df -h /
          echo "=== 产物 ==="
          ls -lh openwrt/bin/targets/mediatek/filogic/ || true
          echo "=== 校验值 ==="
          cat openwrt/bin/targets/mediatek/filogic/sha256sums 2>/dev/null || true

      - name: 上传固件
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-112m-${{ inputs.tag }}
          path: |
            openwrt/bin/targets/mediatek/filogic/*.itb
            openwrt/bin/targets/mediatek/filogic/*.fip
            openwrt/bin/targets/mediatek/filogic/*.bin
            openwrt/bin/targets/mediatek/filogic/sha256sums
            openwrt/bin/targets/mediatek/filogic/profiles.json
            112m-changes.diff
          if-no-files-found: warn
          retention-days: 60

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: |
            112m-changes.diff
            openwrt/.config
          if-no-files-found: ignore
          retention-days: 7
